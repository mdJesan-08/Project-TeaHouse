<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaHouse</title>

    <!-- Manrope font family added -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <!-- Tailwind Css -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        * {
            font-family: "Manrope", sans-serif;
            font-optical-sizing: auto;
        }
    </style>
</head>
<body class="max-w-400 mx-auto border-4 border-cyan-400">
    <section class="grid grid-cols-1 md:grid-cols-2 gap-2">

        <div class="banner-left border-8 border-amber-600 ">

            <h2 class="text-[80px] font-extrabold">It's good <br>
                 tea time at <br>
                 The Tea House
            </h2>

            <p class="text-[18px] text-gray-500">Tea and Botanical Solutions Supplier Give Optimum <br>Satisfaction To Your Taste Buds.</p>

            <button class="rounded-[10px] bg-linear-to-l from-[#FF0000] to-[#FF8938] border-none px-2 py-2 text-white flex gap-1.5">
                <p class="text-white font-bold">Explore More </p>
                <img src="./images/arrow.png" alt="">
            </button>
        </div>


        <div class="banner-right border-8 border-amber-950 flex justify-end items-end">
            <img src="./images/banner.png" alt="">
        </div>
    </section>
</body>
</html>
